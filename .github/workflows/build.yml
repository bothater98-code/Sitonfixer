name: Sitonfixer - free iOS build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-check:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed source package
        run: echo "fc2b674b41b83bff00a6a4030b370cec46178134c6e42ea56beb8e9fa2db59b9  Sitonfixer-source.zip" | shasum -a 256 -c -
      - name: Reconstruct pinned source
        run: |
          unzip -q Sitonfixer-source.zip -d payload
          python3 payload/Sitonfixer/bootstrap.py --destination source
      - name: Verify synthetic translation without games
        run: bash source/sitonfixer/check-scalar-macos.sh
      - name: Verify large core symbol-table handling
        run: python3 source/sitonfixer/check-core-export-regression.py
      - name: Verify private frontend instruction access
        run: bash source/sitonfixer/check-frontend-native.sh
      - name: Typecheck native components against iOS SDK
        run: bash source/sitonfixer/typecheck-ios.sh
      - name: Verify library signature regression
        run: |
          python3 source/sitonfixer/prepare-codesign.py
          cargo test --manifest-path source/.sitonfixer-deps/apple-codesign-quick-0.1.0/Cargo.toml --lib --locked
      - name: Verify exact host identity binding
        run: |
          rustc --test source/jit/muffin-jit/src/probe_identity.rs -o "$RUNNER_TEMP/probe-identity-check"
          "$RUNNER_TEMP/probe-identity-check"
  build:
    needs: native-check
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      SITONFIXER_BUILD_CORE_FROM_SOURCE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify and reconstruct reviewed source
        run: |
          echo "fc2b674b41b83bff00a6a4030b370cec46178134c6e42ea56beb8e9fa2db59b9  Sitonfixer-source.zip" | shasum -a 256 -c -
          unzip -q Sitonfixer-source.zip -d payload
          python3 payload/Sitonfixer/bootstrap.py --destination source
      - name: Prepare macOS dependencies
        run: bash source/sitonfixer/prepare-macos.sh
      - name: Build free-signing target
        run: bash source/sitonfixer/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sitonfixer-unsigned
          path: source/sitonfixer-dist/Sitonfixer-unsigned.ipa
          retention-days: 7
